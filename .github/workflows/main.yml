name: CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: main

    env:
      DOCKER_NAMESPACE: ${{ secrets.DOCKER_HUB_USERNAME }}
      IMAGE_NAME: sidini
      IMAGE_TAG: latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deployment:
    needs: build
    runs-on: ubuntu-latest
    environment: main

    env:
      CONTAINER_NAME: sidini
      DOCKER_NAMESPACE: ${{ secrets.DOCKER_HUB_USERNAME }}
      IMAGE_NAME: sidini
      IMAGE_TAG: latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            docker pull $DOCKER_NAMESPACE/$IMAGE_NAME:$IMAGE_TAG
            docker run -d \
              --name $CONTAINER_NAME \
              -p 3000:3000 \
              $DOCKER_NAMESPACE/$IMAGE_NAME:$IMAGE_TAG
